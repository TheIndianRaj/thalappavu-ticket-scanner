<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Ticket Scanner</title>

  <!-- QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .page {
      min-height: 100vh;
      padding: 24px 16px 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }

    /* -----------------------------------------
       HEADINGS
       ----------------------------------------- */

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
      line-height: 1.1;
      letter-spacing: -1.5px;
    }

    h2 {
      margin: 10px 0;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      line-height: 1.5;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #6b6f75;
      font-size: 20px;
      line-height: 1.5;
    }

    /* -----------------------------------------
       READY STATUS
       ----------------------------------------- */

    .ready {
      color: #07883b;
      font-size: 27px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .ready::first-letter {
      font-size: 24px;
    }

    .scanner-info {
      color: #6b6f75;
      font-size: 18px;
      margin: 0 0 28px;
    }

    /* -----------------------------------------
       BUTTONS
       ----------------------------------------- */

    .primary-button {
      width: 100%;
      min-height: 64px;
      padding: 16px 20px;
      border-radius: 18px;
      background: #087ff5;
      color: white;
      font-size: 21px;
      font-weight: 700;
      transition:
        transform 0.1s ease,
        background 0.2s ease;
    }

    .primary-button:active {
      transform: scale(0.98);
      background: #066bd0;
    }

    .secondary-button {
      width: 100%;
      min-height: 60px;
      padding: 14px 20px;
      border-radius: 18px;
      background: #eeeeee;
      color: #202124;
      font-size: 20px;
      font-weight: 600;
    }

    .secondary-button:active {
      transform: scale(0.98);
    }

    .danger-button {
      width: 100%;
      min-height: 58px;
      padding: 14px 20px;
      border-radius: 18px;
      background: #eeeeee;
      color: #333333;
      font-size: 18px;
      font-weight: 600;
    }

    /* -----------------------------------------
       CAMERA HELP
       ----------------------------------------- */

    .permission-box {
      margin-top: 24px;
      padding: 20px;
      border-radius: 18px;
      background: #eef5ff;
      border: 1px solid #cfe1ff;
    }

    .permission-title {
      color: #0759a5;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .permission-box p {
      margin: 6px 0;
      color: #64686d;
      font-size: 17px;
    }

    details {
      margin-top: 12px;
    }

    summary {
      color: #0875d1;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 0;
    }

    .permission-steps {
      margin-top: 14px;
      padding-left: 22px;
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    /* -----------------------------------------
       REGISTRATION
       ----------------------------------------- */

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .input {
      width: 100%;
      min-height: 58px;
      padding: 14px 16px;
      border: 1px solid #c9cdd2;
      border-radius: 15px;
      outline: none;
      font-size: 18px;
      color: #202124;
      background: #fff;
    }

    .input:focus {
      border-color: #087ff5;
      box-shadow: 0 0 0 3px rgba(8, 127, 245, 0.12);
    }

    .registration-note {
      margin-top: 18px;
      color: #70757a;
      font-size: 15px;
      line-height: 1.5;
    }

    /* -----------------------------------------
       SCANNER
       ----------------------------------------- */

    .scanner-card {
      padding: 26px 20px 24px;
    }

    .scanner-header {
      padding: 4px 4px 18px;
    }

    .scanner-header h1 {
      font-size: 36px;
    }

    #qr-reader {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 20px;
      background: #111;
    }

    #qr-reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 20px;
      display: block;
    }

    /*
      html5-qrcode can create its own UI.
      We hide unnecessary text/buttons generated by it.
    */

    #qr-reader__dashboard_section_csr {
      display: none !important;
    }

    #qr-reader__dashboard_section_swaplink {
      display: none !important;
    }

    #qr-reader__scan_region {
      min-height: 280px;
    }

    .scanner-help {
      text-align: center;
      margin: 18px 0;
      color: #666;
      font-size: 17px;
    }

    /* -----------------------------------------
       CHECKING
       ----------------------------------------- */

    .checking-card {
      text-align: center;
      padding: 60px 25px;
    }

    .spinner {
      width: 64px;
      height: 64px;
      margin: 0 auto 25px;
      border: 7px solid #e0e0e0;
      border-top-color: #087ff5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .checking-card h2 {
      font-size: 25px;
    }

    .checking-card p {
      color: #70757a;
      font-size: 17px;
    }

    /* -----------------------------------------
       RESULT CARDS
       ----------------------------------------- */

    .result-card {
      text-align: center;
      border-top: 10px solid;
      padding-top: 35px;
    }

    .result-valid {
      border-color: #0a9f4b;
    }

    .result-invalid {
      border-color: #e11d2e;
    }

    .result-error {
      border-color: #f39c12;
    }

    .result-icon {
      font-size: 68px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 15px;
    }

    .result-valid .result-icon {
      color: #0a9f4b;
    }

    .result-invalid .result-icon {
      color: #e11d2e;
    }

    .result-error .result-icon {
      color: #f39c12;
    }

    .result-title {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .result-valid .result-title {
      color: #087f3d;
    }

    .result-invalid .result-title {
      color: #d7192e;
    }

    .result-error .result-title {
      color: #d98900;
    }

    .ticket-id {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 18px 0 28px;
      word-break: break-word;
    }

    .entry-status {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .result-message {
      color: #6b6f75;
      font-size: 19px;
      margin: 0 0 30px;
    }

    /* -----------------------------------------
       SMALL TEXT
       ----------------------------------------- */

    .small {
      color: #70757a;
      font-size: 15px;
      line-height: 1.5;
    }

    .error-message {
      color: #666;
      font-size: 17px;
      line-height: 1.5;
      word-break: break-word;
      margin: 20px 0 28px;
    }

    /* -----------------------------------------
       SPACING
       ----------------------------------------- */

    .button-gap {
      margin-top: 14px;
    }

    .top-gap {
      margin-top: 25px;
    }

    /* -----------------------------------------
       MOBILE
       ----------------------------------------- */

    @media (max-width: 600px) {

      .page {
        padding: 14px 10px 30px;
      }

      .card {
        padding: 28px 20px;
        border-radius: 24px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 18px;
      }

      .primary-button {
        min-height: 62px;
        font-size: 20px;
      }

      .result-title {
        font-size: 31px;
      }

      .entry-status {
        font-size: 25px;
      }

      #qr-reader__scan_region {
        min-height: 250px;
      }
    }

  </style>
</head>

<body>

<div id="app"></div>


<script>

/* ============================================================
   CONFIGURATION
   ============================================================

   IMPORTANT:

   Put your STABLE Apps Script API/Web App URL here.

   Example:

   https://script.google.com/macros/s/XXXXXXXXXXXX/exec

   Your printed QR codes should NOT contain this URL.

   They should contain only the Ticket ID or a deployment-
   independent ticket validation URL.

   ============================================================ */

const CONFIG = {

  API_URL:
    "https://script.google.com/macros/s/AKfycbyTVy6vn2zxI8Aeqm5uLGmdf5wY34Js-I_Zpfa1XxgZaluVDXgExmHk6evCM798Ap-w/exec",

  CAMERA_START_DELAY: 400,

  VALIDATION_TIMEOUT: 15000

};


/* ============================================================
   APPLICATION STATE
   ============================================================ */

let scanner = null;

let scannerRunning = false;

let scanInProgress = false;

let validationInProgress = false;

let cameraStarting = false;

let currentStream = null;


/* ============================================================
   LOCAL STORAGE
   ============================================================ */

const STORAGE_KEYS = {

  scannerId: "ticket_scanner_id",

  scannerName: "ticket_scanner_name",

  registered: "ticket_scanner_registered"

};


/* ============================================================
   APP INITIALIZATION
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    initializeApp();

  }
);


function initializeApp() {

  if (
    CONFIG.API_URL.includes("PASTE_YOUR") ||
    !CONFIG.API_URL
  ) {

    showConfigurationError();

    return;
  }

  const registered =
    localStorage.getItem(
      STORAGE_KEYS.registered
    );

  const scannerId =
    localStorage.getItem(
      STORAGE_KEYS.scannerId
    );

  if (
    registered === "true" &&
    scannerId
  ) {

    showReadyScreen();

  } else {

    showRegistrationScreen();

  }

}


/* ============================================================
   REGISTRATION SCREEN
   ============================================================ */

function showRegistrationScreen() {

  stopAndDestroyScanner();

  document.getElementById("app").innerHTML = `

    <div class="page">

      <div class="container">

        <div class="card">

          <h1>Register Scanner</h1>

          <p class="subtitle">
            Register this phone as an
            authorized event scanner.
          </p>

          <div class="form-group">

            <label
              class="form-label"
              for="scannerName">

              Scanner name

            </label>

            <input
              id="scannerName"
              class="input"
              type="text"
              placeholder="Main Gate 1"
              autocomplete="off"
            >

          </div>

          <div class="form-group">

            <label
              class="form-label"
              for="registrationCode">

              Registration code

            </label>

            <input
              id="registrationCode"
              class="input"
              type="password"
              placeholder="Registration code"
              autocomplete="off"
            >

          </div>

          <button
            id="registerButton"
            class="primary-button"
            onclick="registerScanner()">

            REGISTER THIS PHONE

          </button>

          <div
            id="registrationMessage"
            class="registration-note">
          </div>

        </div>

      </div>

    </div>

  `;

}


/* ============================================================
   REGISTER PHONE
   ============================================================ */

async function registerScanner() {

  const nameElement =
    document.getElementById("scannerName");

  const codeElement =
    document.getElementById("registrationCode");

  const button =
    document.getElementById("registerButton");

  const message =
    document.getElementById("registrationMessage");

  const scannerName =
    nameElement.value.trim();

  const registrationCode =
    codeElement.value.trim();


  if (!scannerName) {

    message.textContent =
      "Please enter a scanner name.";

    return;

  }


  if (!registrationCode) {

    message.textContent =
      "Please enter the registration code.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "REGISTERING...";

  message.textContent =
    "Registering this phone...";


  try {

    const result =
      await callApi(
        "registerScanner",
        {
          scannerName:
            scannerName,

          registrationCode:
            registrationCode
        }
      );


    if (
      result &&
      result.success
    ) {

      const scannerId =
        result.scannerId ||
        result.deviceId;


      if (!scannerId) {

        throw new Error(
          "The server did not return a scanner ID."
        );

      }


      localStorage.setItem(
        STORAGE_KEYS.scannerId,
        scannerId
      );

      localStorage.setItem(
        STORAGE_KEYS.scannerName,
        scannerName
      );

      localStorage.setItem(
        STORAGE_KEYS.registered,
        "true"
      );


      showReadyScreen();

      return;

    }


    throw new Error(
      result &&
      result.message
        ? result.message
        : "Registration failed."
    );


  } catch (error) {

    console.error(
      "Registration error:",
      error
    );

    message.textContent =
      error.message ||
      "Registration failed.";

    button.disabled = false;

    button.textContent =
      "REGISTER THIS PHONE";

  }

}


/* ============================================================
   READY SCREEN
   ============================================================ */

function showReadyScreen() {

  stopAndDestroyScanner();

  const scannerName =
    localStorage.getItem(
      STORAGE_KEYS.scannerName
    ) ||
    "Event Scanner";

  const scannerId =
    localStorage.getItem(
      STORAGE_KEYS.scannerId
    ) ||
    "";


  document.getElementById("app").innerHTML = `

    <div class="page">

      <div class="container">

        <div class="card">

          <div class="ready">
            ● READY
          </div>

          <h1>
            Ticket Scanner
          </h1>

          <p class="scanner-info">
            ${escapeHtml(scannerName)}
            ${scannerId
              ? " • " + escapeHtml(scannerId)
              : ""}
          </p>


          <button
            class="primary-button"
            onclick="startScanner()">

            📷 SCAN TICKET

          </button>


          <div class="permission-box">

            <div class="permission-title">
              📷 Camera permission
            </div>

            <p>
              Camera access is required
              to scan tickets.
            </p>

            <details>

              <summary>
                How to allow camera access
              </summary>

              <ol class="permission-steps">

                <li>
                  Tap the site settings icon
                  beside the website address.
                </li>

                <li>
                  Open
                  <strong>Permissions</strong>.
                </li>

                <li>
                  Select
                  <strong>Camera</strong>.
                </li>

                <li>
                  Select
                  <strong>Allow</strong>.
                </li>

                <li>
                  Return to this page and tap
                  <strong>SCAN TICKET</strong>.
                </li>

              </ol>

            </details>

          </div>


          <div class="top-gap">

            <button
              class="danger-button"
              onclick="unregisterScanner()">

              Unregister this scanner

            </button>

          </div>

        </div>

      </div>

    </div>

  `;

}


/* ============================================================
   START SCANNER
   ============================================================ */

async function startScanner() {

  if (scannerRunning || cameraStarting) {

    console.log(
      "Scanner already running."
    );

    return;

  }


  if (scanInProgress) {

    console.log(
      "Scan already in progress."
    );

    return;

  }


  cameraStarting = true;

  scanInProgress = true;


  /*
   * VERY IMPORTANT:
   *
   * Destroy the previous scanner before
   * creating another one.
   *
   * This fixes the Android second-scan
   * problem.
   */

  await stopAndDestroyScanner();


  renderScannerScreen();


  /*
   * Give the browser time to create
   * the #qr-reader element.
   */

  await sleep(
    CONFIG.CAMERA_START_DELAY
  );


  try {

    scanner =
      new Html5Qrcode(
        "qr-reader"
      );


    /*
     * Start a completely fresh camera.
     */

    await scanner.start(

      {
        facingMode: "environment"
      },

      {

        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70;

          return {
            width: Math.floor(size),
            height: Math.floor(size)
          };

        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      function(decodedText) {

        handleQrDetected(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * This is normal.
         *
         * html5-qrcode reports a scan
         * failure every time it doesn't
         * find a QR code in a frame.
         *
         * Do not display these errors.
         */

      }

    );


    scannerRunning = true;

    cameraStarting = false;

    console.log(
      "Camera started successfully."
    );


  } catch (error) {

    console.error(
      "Camera start failed:",
      error
    );

    scannerRunning = false;

    cameraStarting = false;

    scanInProgress = false;

    await stopAndDestroyScanner();

    showCameraError(
      error
    );

  }

}


/* ============================================================
   QR DETECTED
   ============================================================ */

async function handleQrDetected(
  decodedText
) {

  /*
   * Prevent the same QR code from
   * triggering multiple times.
   */

  if (
    validationInProgress ||
    !scanInProgress
  ) {

    return;

  }


  validationInProgress = true;

  scanInProgress = false;


  const ticketValue =
    String(decodedText || "")
      .trim();


  console.log(
    "QR detected:",
    ticketValue
  );


  /*
   * STOP CAMERA IMMEDIATELY.
   */

  await stopAndDestroyScanner();


  /*
   * Now validate.
   */

  await validateTicket(
    ticketValue
  );

}


/* ============================================================
   STOP + DESTROY CAMERA
   ============================================================ */

async function stopAndDestroyScanner() {

  scannerRunning = false;


  if (!scanner) {

    /*
     * Also stop any camera tracks
     * that may still exist.
     */

    stopMediaTracks();

    return;

  }


  try {

    if (
      scanner.isScanning
    ) {

      await scanner.stop();

    }

  } catch (error) {

    console.warn(
      "Scanner stop:",
      error
    );

  }


  try {

    await scanner.clear();

  } catch (error) {

    console.warn(
      "Scanner clear:",
      error
    );

  }


  scanner = null;


  stopMediaTracks();


  /*
   * Android Chrome sometimes needs
   * a short delay before releasing
   * the camera completely.
   */

  await sleep(250);

}


/* ============================================================
   STOP MEDIA STREAMS
   ============================================================ */

function stopMediaTracks() {

  try {

    if (currentStream) {

      currentStream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

      currentStream = null;

    }


    const videos =
      document.querySelectorAll(
        "#qr-reader video"
      );


    videos.forEach(
      function(video) {

        if (
          video.srcObject
        ) {

          const stream =
            video.srcObject;

          stream
            .getTracks()
            .forEach(
              function(track) {

                track.stop();

              }
            );

          video.srcObject = null;

        }

      }
    );

  } catch (error) {

    console.warn(
      "Media cleanup:",
      error
    );

  }

}


/* ============================================================
   SCANNER SCREEN
   ============================================================ */

function renderScannerScreen() {

  document.getElementById("app").innerHTML = `

    <div class="page">

      <div class="container">

        <div class="card scanner-card">

          <div class="scanner-header">

            <h1>
              Scan Ticket
            </h1>

            <p class="subtitle">
              Point the camera at the QR code
              printed on the ticket.
            </p>

          </div>


          <div id="qr-reader"></div>


          <p class="scanner-help">
            Point the camera at the QR code.
          </p>


          <button
            class="secondary-button"
            onclick="cancelScan()">

            CANCEL

          </button>

        </div>

      </div>

    </div>

  `;

}


/* ============================================================
   CANCEL SCAN
   ============================================================ */

async function cancelScan() {

  validationInProgress = false;

  scanInProgress = false;

  cameraStarting = false;


  await stopAndDestroyScanner();


  showReadyScreen();

}


/* ============================================================
   VALIDATE TICKET
   ============================================================ */

async function validateTicket(
  ticketValue
) {

  if (!ticketValue) {

    validationInProgress = false;

    showSystemError(
      "The QR code does not contain a ticket ID."
    );

    return;

  }


  showCheckingScreen();


  try {

    const result =
      await callApiWithTimeout(
        "validateTicket",
        {

          ticketId:
            ticketValue,

          scannerId:
            localStorage.getItem(
              STORAGE_KEYS.scannerId
            ),

          scannerName:
            localStorage.getItem(
              STORAGE_KEYS.scannerName
            )

        },

        CONFIG.VALIDATION_TIMEOUT

      );


    console.log(
      "Validation response:",
      result
    );


    validationInProgress = false;


    handleValidationResult(
      result,
      ticketValue
    );


  } catch (error) {

    console.error(
      "Validation failed:",
      error
    );


    validationInProgress = false;


    showSystemError(
      error.message ||
      "Unable to validate the ticket."
    );

  }

}


/* ============================================================
   HANDLE VALIDATION RESULT
   ============================================================ */

function handleValidationResult(
  result,
  ticketValue
) {

  if (!result) {

    showSystemError(
      "The server returned no response."
    );

    return;

  }


  /*
   * Support several common response formats.
   */

  const status =
    String(
      result.status ||
      result.result ||
      ""
    )
      .toUpperCase();


  const ticketId =
    result.ticketId ||
    result.ticketID ||
    ticketValue;


  if (
    status === "VALID" ||
    status === "AVAILABLE" ||
    status === "SUCCESS"
  ) {

    showValidTicket(
      ticketId,
      result.message
    );

    return;

  }


  if (
    status === "ALREADY_USED" ||
    status === "USED"
  ) {

    showAlreadyUsed(
      ticketId,
      result.message
    );

    return;

  }


  if (
    status === "INVALID" ||
    status === "NOT_FOUND"
  ) {

    showInvalidTicket(
      ticketId,
      result.message
    );

    return;

  }


  /*
   * Some Apps Script implementations
   * return { valid: true/false }.
   */

  if (
    result.valid === true
  ) {

    showValidTicket(
      ticketId,
      result.message
    );

    return;

  }


  if (
    result.valid === false
  ) {

    if (
      result.alreadyUsed ||
      result.used
    ) {

      showAlreadyUsed(
        ticketId,
        result.message
      );

    } else {

      showInvalidTicket(
        ticketId,
        result.message
      );

    }

    return;

  }


  showSystemError(
    result.message ||
    "Unexpected response from the ticket server."
  );

}

/* ============================================================
   SCAN NEXT TICKET
   ============================================================ */

async function scanNextTicket() {

  console.log(
    "SCAN NEXT TICKET clicked"
  );


  /*
   * Reset all state.
   */

  validationInProgress = false;

  scanInProgress = false;

  cameraStarting = false;


  /*
   * IMPORTANT:
   *
   * Completely release camera from
   * previous scan before starting
   * another one.
   */

  await stopAndDestroyScanner();


  /*
   * Small Android Chrome delay.
   */

  await sleep(400);


  /*
   * Start a brand-new scanner.
   */

  startScanner();

}


/* ============================================================
   UNREGISTER SCANNER
   ============================================================ */

async function unregisterScanner() {

  const confirmed =
    window.confirm(
      "Unregister this scanner from this phone?"
    );


  if (!confirmed) {

    return;

  }


  await stopAndDestroyScanner();


  localStorage.removeItem(
    STORAGE_KEYS.scannerId
  );

  localStorage.removeItem(
    STORAGE_KEYS.scannerName
  );

  localStorage.removeItem(
    STORAGE_KEYS.registered
  );


  showRegistrationScreen();

}


/* ============================================================
   API CALL
   ============================================================ */

async function callApi(
  action,
  params = {}
) {

  if (
    !CONFIG.API_URL ||
    CONFIG.API_URL.includes("PASTE_YOUR")
  ) {

    throw new Error(
      "Apps Script API URL has not been configured."
    );

  }


  const url =
    new URL(
      CONFIG.API_URL
    );


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(
      function(key) {

        const value =
          params[key];

        if (
          value !== undefined &&
          value !== null
        ) {

          url.searchParams.set(
            key,
            value
          );

        }

      }
    );


  console.log(
    "API request:",
    action
  );


  const response =
    await fetch(
      url.toString(),
      {

        method: "GET",

        cache: "no-store",

        redirect: "follow"

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "Server returned HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  console.log(
    "API raw response:",
    text
  );


  try {

    return JSON.parse(
      text
    );

  } catch (error) {

    throw new Error(
      "The server returned an invalid response."
    );

  }

}


/* ============================================================
   API CALL WITH TIMEOUT
   ============================================================ */

async function callApiWithTimeout(
  action,
  params,
  timeout
) {

  return Promise.race([

    callApi(
      action,
      params
    ),

    new Promise(
      function(
        resolve,
        reject
      ) {

        setTimeout(
          function() {

            reject(
              new Error(
                "The ticket server did not respond. Please check the internet connection and try again."
              )
            );

          },
          timeout
        );

      }
    )

  ]);

}

/* ============================================================
   UTILITY: SLEEP
   ============================================================ */

function sleep(
  milliseconds
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


/* ============================================================
   UTILITY: ESCAPE HTML
   ============================================================ */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   HANDLE PAGE CLOSING / HIDING
   ============================================================ */

document.addEventListener(
  "visibilitychange",
  async function() {

    /*
     * If the user leaves the page,
     * release the camera.
     */

    if (
      document.hidden &&
      scanner
    ) {

      await stopAndDestroyScanner();

    }

  }
);


/* ============================================================
   HANDLE BACK/FORWARD CACHE
   ============================================================ */

window.addEventListener(
  "pageshow",
  function(event) {

    /*
     * Android Chrome may restore the page
     * from its back-forward cache.

     * Make sure the scanner state is clean.
     */

    if (
      event.persisted
    ) {

      scanner = null;

      scannerRunning = false;

      scanInProgress = false;

      validationInProgress = false;

      cameraStarting = false;

      initializeApp();

    }

  }
);
