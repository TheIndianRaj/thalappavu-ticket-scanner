<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <meta name="theme-color" content="#111827">

  <title>Event Ticket Scanner</title>

  <!-- QR scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    /* =====================================================
       GLOBAL
       ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f4f7fb 0%,
          #eef2f6 100%
        );

      color: #17191c;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      min-height: 100vh;

      padding:
        22px
        16px
        40px;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }


    /* =====================================================
       CARD
       ===================================================== */

    .card {
      background: #ffffff;

      border-radius: 30px;

      padding:
        34px
        28px;

      box-shadow:
        0 10px 35px rgba(
          0,
          0,
          0,
          0.08
        );
    }


    /* =====================================================
       EVENT BRAND
       ===================================================== */

    .event-brand {
      margin-bottom: 28px;
      border-radius: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, #28344b 0%, #111827 58%, #080b12 100%);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow:
        0 12px 30px rgba(15,23,42,.18);
    }

    .event-brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 18px 10px;
      min-height: 128px;
    }

    .event-brand-logo img {
      display: block;
      width: min(100%, 360px);
      height: auto;
      max-height: 150px;
      object-fit: contain;
    }

    .event-brand-caption {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      padding: 10px 16px 12px;
      background: rgba(0,0,0,.20);
      color: #f6c515;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .event-brand-caption::before,
    .event-brand-caption::after {
      content: "";
      width: 24px;
      height: 1px;
      background: rgba(246,197,21,.55);
    }

    /* =====================================================
       HEADINGS
       ===================================================== */

    h1 {
      margin: 0 0 12px;

      font-size: 42px;
      line-height: 1.08;

      letter-spacing: -1.6px;
    }

    h2 {
      margin: 0;

      font-size: 28px;
      line-height: 1.2;
    }

    .subtitle {
      margin:
        0
        0
        34px;

      font-size: 19px;
      line-height: 1.55;

      color: #6c737b;
    }


    /* =====================================================
       FORM
       ===================================================== */

    .form-group {
      margin-bottom: 22px;
    }

    .label {
      display: block;

      margin-bottom: 9px;

      font-size: 17px;
      font-weight: 700;

      color: #24272b;
    }

    .input {
      width: 100%;

      min-height: 62px;

      padding:
        14px
        17px;

      border:
        1px solid
        #cdd2d8;

      border-radius: 17px;

      background: #fff;

      font-size: 19px;

      outline: none;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    .input.invalid {
      border-color: #d7192e;
      box-shadow:
        0 0 0 3px
        rgba(
          215,
          25,
          46,
          0.08
        );
    }

    .input:focus {
      border-color: #087ff5;

      box-shadow:
        0 0 0 4px
        rgba(
          8,
          127,
          245,
          0.12
        );
    }


    /* =====================================================
       PRIMARY BUTTON
       ===================================================== */

    .primary {
      width: 100%;

      min-height: 64px;

      padding:
        14px
        20px;

      border: none;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #f6c515,
          #d99f00
        );

      color: #111827;

      font-size: 20px;
      font-weight: 750;

      box-shadow:
        0 8px 20px
        rgba(
          217,
          159,
          0,
          0.28
        );

      transition:
        transform .1s,
        opacity .2s;
    }

    .primary:active {
      transform: scale(.985);
    }

    .primary:disabled {
      opacity: .55;
      cursor: default;
    }


    /* =====================================================
       SECONDARY
       ===================================================== */

    .secondary {
      width: 100%;

      min-height: 58px;

      padding:
        13px
        18px;

      border: none;

      border-radius: 17px;

      background: #eeeeef;

      color: #292c30;

      font-size: 18px;
      font-weight: 650;
    }


    /* =====================================================
       INFORMATION BOX
       ===================================================== */

    .info-box {
      margin-top: 25px;

      padding: 19px;

      border-radius: 18px;

      background: #f0f6ff;

      border:
        1px solid
        #d3e4fb;
    }

    .info-title {
      color: #075da8;

      font-size: 17px;
      font-weight: 750;

      margin-bottom: 7px;
    }

    .info-text {
      margin: 0;

      color: #68727d;

      font-size: 15px;

      line-height: 1.55;
    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    .message {
      min-height: 25px;

      margin-top: 18px;

      color: #6b7075;

      font-size: 16px;

      line-height: 1.45;
    }

    .message.error {
      color: #c62828;
    }

    .message.success {
      color: #087f3d;
    }


    /* =====================================================
       READY SCREEN
       ===================================================== */

    .ready-status {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 8px;

      color: #07883b;

      font-size: 21px;
      font-weight: 750;
    }

    .ready-dot {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: #08a44f;
    }

    .scanner-details {
      color: #70777e;

      font-size: 17px;

      margin:
        0
        0
        27px;
    }


    /* =====================================================
       CAMERA HELP
       ===================================================== */

    .camera-help {
      margin-top: 23px;

      padding: 18px;

      border-radius: 18px;

      background: #f0f6ff;

      border:
        1px solid
        #d4e4fa;
    }

    .camera-help-title {
      color: #075da8;

      font-size: 18px;
      font-weight: 750;

      margin-bottom: 5px;
    }

    .camera-help p {
      margin: 0;

      color: #69727b;

      font-size: 15px;

      line-height: 1.5;
    }

    details {
      margin-top: 12px;
    }

    summary {
      color: #0875d1;

      font-weight: 650;

      font-size: 16px;

      cursor: pointer;
    }

    .permission-list {
      margin:
        12px
        0
        0
        20px;

      padding: 0;

      color: #5d646c;

      font-size: 15px;

      line-height: 1.6;
    }


    /* =====================================================
       SCANNER
       ===================================================== */

    #qr-reader {
      width: 100%;

      overflow: hidden;

      border-radius: 22px;

      background: #101010;
    }

    #qr-reader video {
      width: 100% !important;

      height: auto !important;

      display: block;

      border-radius: 22px;
    }

    #qr-reader__dashboard {
      display: none !important;
    }

    #qr-reader__dashboard_section_csr {
      display: none !important;
    }

    #qr-reader__dashboard_section_swaplink {
      display: none !important;
    }

    .scanner-instruction {
      text-align: center;

      color: #697078;

      font-size: 17px;

      margin:
        18px
        0;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading-card {
      text-align: center;

      padding:
        70px
        25px;
    }

    .spinner {
      width: 62px;
      height: 62px;

      margin:
        0
        auto
        25px;

      border:
        7px solid
        #e3e6e9;

      border-top-color:
        #087ff5;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    /* =====================================================
       RESULT
       ===================================================== */

    .result {
      text-align: center;

      padding-top: 20px;

      border-top:
        9px solid;
    }

    .result.valid {
      border-color: #08a44f;
    }

    .result.invalid {
      border-color: #e21d2d;
    }

    .result.error {
      border-color: #ed9c00;
    }

    .result-icon {
      font-size: 62px;

      line-height: 1;

      margin-bottom: 12px;
    }

    .result.valid .result-icon {
      color: #08a44f;
    }

    .result.invalid .result-icon {
      color: #e21d2d;
    }

    .result.error .result-icon {
      color: #ed9c00;
    }

    .result-title {
      font-size: 33px;

      font-weight: 800;

      margin-bottom: 25px;
    }

    .result.valid .result-title {
      color: #087f3d;
    }

    .result.invalid .result-title {
      color: #d7192e;
    }

    .result.error .result-title {
      color: #d88a00;
    }

    .ticket-id {
      font-size: 21px;

      font-weight: 750;

      word-break: break-word;

      margin:
        15px
        0
        25px;
    }

    .entry {
      font-size: 26px;

      font-weight: 800;

      margin-bottom: 10px;
    }

    .result-message {
      color: #6b7177;

      font-size: 18px;

      line-height: 1.5;

      margin:
        0
        0
        28px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .page {
        padding:
          14px
          10px
          30px;
      }

      .card {
        padding:
          28px
          20px;

        border-radius: 25px;
      }

      h1 {
        font-size: 39px;
      }

      .subtitle {
        font-size: 18px;
      }

      .event-brand {
        margin-bottom: 22px;
      }

      .event-brand-logo {
        min-height: 112px;
        padding: 12px 14px 8px;
      }

      .event-brand-caption {
        font-size: 10px;
        letter-spacing: 1.1px;
      }

    }

  </style>

</head>


<body>

<div id="app"></div>


<script>

/* ============================================================
   CONFIGURATION
   ============================================================

   IMPORTANT:
   Put your STABLE Apps Script /exec URL here.

   Example:

   https://script.google.com/macros/s/XXXXXXXX/exec

   ============================================================ */

const CONFIG = {

  API_URL:
    "https://script.google.com/macros/s/AKfycbzznTrAiPNcTgeKVoPn5Tq1Ajf1hZ64RYRwRTuydHe33yo-x8XxTncGk3mBOMoEwgWs/exec",

  VALIDATION_TIMEOUT:
    15000,

  CAMERA_DELAY:
    500

};


/* ============================================================
   STATE
   ============================================================ */

let scanner = null;

let scannerRunning = false;

let cameraStarting = false;

let scanInProgress = false;

let validationInProgress = false;


/* ============================================================
   STORAGE
   ============================================================ */

const STORAGE = {

  registered:
    "ticket_scanner_registered",

  scannerId:
    "ticket_scanner_id",

  scannerName:
    "ticket_scanner_name",

  token:
    "ticket_scanner_token"

};


/* ============================================================
   START
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  initialize
);


function initialize() {

  if (
    !CONFIG.API_URL ||
    CONFIG.API_URL.includes("PASTE_YOUR")
  ) {

    showConfigError();

    return;

  }


  const registered =
    localStorage.getItem(
      STORAGE.registered
    );

  const scannerId =
    localStorage.getItem(
      STORAGE.scannerId
    );

  const token =
    localStorage.getItem(
      STORAGE.token
    );


  if (
    registered === "true" &&
    scannerId &&
    token
  ) {

    showReady();

  } else {

    localStorage.removeItem(
      STORAGE.registered
    );

    localStorage.removeItem(
      STORAGE.scannerId
    );

    localStorage.removeItem(
      STORAGE.scannerName
    );

    localStorage.removeItem(
      STORAGE.token
    );

    showRegistration();

  }

}


/* ============================================================
   EVENT BRAND
   ============================================================ */

function eventBrandMarkup() {

  return `
    <div class="event-brand">
      <div class="event-brand-logo">
        <img
          src="event-logo.png"
          alt="Thalappavu event logo"
        >
      </div>

      <div class="event-brand-caption">
        EVENT TICKET SYSTEM
      </div>
    </div>
  `;

}


/* ============================================================
   REGISTRATION SCREEN
   ============================================================ */

function showRegistration() {

  cleanupScanner();

  document.getElementById("app").innerHTML = `

    <div class="page">

      <div class="container">

        <div class="card">

          ${eventBrandMarkup()}


          <h1>
            Register Scanner
          </h1>


          <p class="subtitle">
            Enter the name of the person who will
            be scanning tickets. This phone can
            then be used to validate tickets.
          </p>


          <form id="registrationForm" novalidate>

            <div class="form-group">

              <label
                class="label"
                for="scannerName">

                Your name

              </label>

              <input
                id="scannerName"
                name="scannerName"
                class="input"
                type="text"
                placeholder="Enter your name"
                autocomplete="off"
                autocapitalize="words"
                spellcheck="false"
                required
              >

            </div>


            <div class="form-group">

              <label
                class="label"
                for="registrationCode">

                Registration code

              </label>

              <input
                id="registrationCode"
                name="registrationCode"
                class="input"
                type="text"
                inputmode="text"
                placeholder="Enter registration code"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                required
              >

            </div>


            <button
              id="registerButton"
              class="primary"
              type="submit">

              REGISTER THIS PHONE

            </button>

          </form>


          <div
            id="registrationMessage"
            class="message">
          </div>


          <div class="info-box">

            <div class="info-title">
              🔐 Authorized device
            </div>

            <p class="info-text">
              Only registered scanner phones
              can validate event tickets.
              Keep this device secure.
            </p>

          </div>

        </div>

      </div>

    </div>

  `;

  const scannerNameInput =
    document.getElementById("scannerName");

  if (scannerNameInput) {
    scannerNameInput.focus();
  }

  const registrationForm =
    document.getElementById("registrationForm");

  registrationForm.addEventListener(
    "submit",
    function(event) {
      event.preventDefault();
      registerScanner();
    }
  );

}


/* ============================================================
   REGISTER
   ============================================================ */

async function registerScanner() {

  const nameInput =
    document.getElementById("scannerName");

  const codeInput =
    document.getElementById("registrationCode");

  const button =
    document.getElementById("registerButton");

  const message =
    document.getElementById("registrationMessage");


  /*
   * Read directly from the actual form controls.
   * Do not use a different field name or dataset value.
   */
  const name =
    String(nameInput.value || "").trim();

  const code =
    String(codeInput.value || "").trim();


  nameInput.classList.remove("invalid");
  codeInput.classList.remove("invalid");


  if (!name || !code) {

    if (!name) {
      nameInput.classList.add("invalid");
    }

    if (!code) {
      codeInput.classList.add("invalid");
    }

    showMessage(
      message,
      !name && !code
        ? "Please enter your name and registration code."
        : !name
          ? "Please enter your name."
          : "Please enter the registration code.",
      true
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "REGISTERING...";


  showMessage(
    message,
    "Connecting to ticket server...",
    false
  );


  try {

    /*
     * Send the normal parameter names PLUS compatibility aliases.
     * This protects the frontend from small naming differences
     * between versions of the Apps Script backend.
     */
    const parameters = {

      scannerName: name,

      registrationCode: code,

      deviceName: name,

      regCode: code,

      name: name,

      code: code

    };


    let result =
      await apiRequest(
        "registerScanner",
        parameters
      );


    /*
     * Older backend versions may expose register instead.
     */
    if (isUnknownAction(result)) {

      result =
        await apiRequest(
          "register",
          parameters
        );

    }


    console.log(
      "Registration response:",
      result
    );


    if (!result) {

      throw new Error(
        "No response received from the server."
      );

    }


    if (
      result.success === true ||
      result.status === "REGISTERED"
    ) {

      const scannerId =
        result.scannerId ||
        result.deviceId ||
        result.id;

      const token =
        result.token;


      if (!scannerId) {

        throw new Error(
          "The server accepted the registration but did not return a scanner ID."
        );

      }

      if (!token) {

        throw new Error(
          "The server accepted the registration but did not return an authentication token."
        );

      }


      localStorage.setItem(
        STORAGE.registered,
        "true"
      );

      localStorage.setItem(
        STORAGE.scannerId,
        String(scannerId)
      );

      localStorage.setItem(
        STORAGE.scannerName,
        name
      );

      localStorage.setItem(
        STORAGE.token,
        String(token)
      );


      showReady();

      return;

    }


    throw new Error(
      result.message ||
      result.error ||
      "Registration was rejected by the server."
    );


  } catch (error) {

    console.error(
      "Registration error:",
      error
    );


    button.disabled = false;

    button.textContent =
      "REGISTER THIS PHONE";


    showMessage(
      message,
      friendlyError(error),
      true
    );

  }

}


/* ============================================================
   READY SCREEN
   ============================================================ */

function showReady() {

  cleanupScanner();


  const name =
    localStorage.getItem(
      STORAGE.scannerName
    ) ||
    "Event Scanner";


  const id =
    localStorage.getItem(
      STORAGE.scannerId
    ) ||
    "";


  document.getElementById("app").innerHTML = `

    <div class="page">

      <div class="container">

        <div class="card">

          ${eventBrandMarkup()}

          <div class="ready-status">

            <span class="ready-dot"></span>

            READY

          </div>


          <h1>
            Ticket Scanner
          </h1>


          <p class="scanner-details">

            ${escapeHtml(name)}

            ${id
              ? " • " +
                escapeHtml(id)
              : ""}

          </p>


          <button
            id="scanButton"
            class="primary"
            type="button">

            📷 &nbsp; SCAN TICKET

          </button>


          <div class="camera-help">

            <div class="camera-help-title">
              📷 Camera permission
            </div>

            <p>
              Camera access is required
              to scan tickets.
            </p>


            <details>

              <summary>
                How to allow camera access
              </summary>


              <ol class="permission-list">

                <li>
                  Tap the site settings icon
                  beside the website address.
                </li>

                <li>
                  Select
                  <strong>Permissions</strong>.
                </li>

                <li>
                  Select
                  <strong>Camera</strong>.
                </li>

                <li>
                  Select
                  <strong>Allow</strong>.
                </li>

                <li>
                  Return here and tap
                  <strong>SCAN TICKET</strong>.
                </li>

              </ol>

            </details>

          </div>


          <div style="margin-top:20px;">

            <button
              id="unregisterButton"
              class="secondary"
              type="button">

              Unregister this scanner

            </button>

          </div>

        </div>

      </div>

    </div>

  `;

  document
    .getElementById("scanButton")
    .addEventListener(
      "click",
      startScanner
    );

  document
    .getElementById("unregisterButton")
    .addEventListener(
      "click",
      unregisterScanner
    );

}


/* ============================================================
   START CAMERA
   ============================================================ */

async function startScanner() {

  if (
    cameraStarting ||
    scannerRunning
  ) {

    return;

  }


  cameraStarting = true;

  scanInProgress = true;


  /*
   * Always destroy previous scanner.
   */

  await cleanupScanner();


  renderScanner();


  await sleep(
    CONFIG.CAMERA_DELAY
  );


  try {

    scanner =
      new Html5Qrcode(
        "qr-reader"
      );


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * 0.70
              );

            return {

              width: size,

              height: size

            };

          },

        disableFlip: false

      },

      function(decodedText) {

        handleQr(
          decodedText
        );

      },

      function() {

        /*
         * Ignore normal
         * "QR not found"
         * messages.
         */

      }

    );


    scannerRunning = true;

    cameraStarting = false;


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    scannerRunning = false;

    cameraStarting = false;

    scanInProgress = false;


    await cleanupScanner();


    showCameraError(
      error
    );

  }

}


/* ============================================================
   QR FOUND
   ============================================================ */

async function handleQr(
  value
) {

  if (
    validationInProgress ||
    !scanInProgress
  ) {

    return;

  }


  validationInProgress = true;

  scanInProgress = false;


  const ticketId =
    String(
      value || ""
    ).trim();


  /*
   * Immediately stop camera.
   */

  await cleanupScanner();


  if (!ticketId) {

    validationInProgress = false;

    showError(
      "The QR code does not contain a ticket ID."
    );

    return;

  }


  validateTicket(
    ticketId
  );

}


/* ============================================================
   VALIDATE
   ============================================================ */

async function validateTicket(
  ticketId
) {

  const deviceId =
    localStorage.getItem(
      STORAGE.scannerId
    );

  const token =
    localStorage.getItem(
      STORAGE.token
    );


  if (!deviceId || !token) {

    validationInProgress = false;

    showError(
      "This scanner is not registered on this phone. Please register the phone again."
    );

    return;

  }


  showChecking();


  try {

    let result =
      await apiRequestWithTimeout(
        "validateTicket",
        {

          ticketId:
            ticketId,

          deviceId:
            localStorage.getItem(
              STORAGE.scannerId
            ),

          token:
            localStorage.getItem(
              STORAGE.token
            )

        },

        CONFIG.VALIDATION_TIMEOUT
      );


    /*
     * Compatibility fallback for
     * older backend action names.
     */

    if (
      isUnknownAction(result)
    ) {

      result =
        await apiRequestWithTimeout(
          "validate",
          {

            ticketId:
              ticketId,

            deviceId:
              localStorage.getItem(
                STORAGE.scannerId
              ),

            token:
              localStorage.getItem(
                STORAGE.token
              )

          },

          CONFIG.VALIDATION_TIMEOUT
        );

    }


    validationInProgress = false;


    processValidation(
      result,
      ticketId
    );


  } catch (error) {

    validationInProgress = false;


    showError(
      friendlyError(
        error
      )
    );

  }

}


/* ============================================================
   PROCESS VALIDATION
   ============================================================ */

function processValidation(
  result,
  ticketId
) {

  if (!result) {

    showError(
      "The server returned no response."
    );

    return;

  }


  console.log(
    "Validation result:",
    result
  );


  const status =
    String(
      result.status ||
      result.result ||
      ""
    ).toUpperCase();


  /*
   * The Apps Script backend can identify a valid ticket in
   * different ways depending on the deployed backend version.
   *
   * The current backend can return:
   *   { success: true, message: "Entry allowed." }
   *
   * Older versions may return valid:true, type:"VALID",
   * or status:"VALID"/"AVAILABLE"/"SUCCESS".
   *
   * IMPORTANT: success:true is a successful validation response.
   * It must NOT fall through to the SYSTEM ERROR screen.
   */
  const success =
    result.success === true ||
    String(result.success).toLowerCase() === "true";

  const valid =
    result.valid === true ||
    String(result.valid).toLowerCase() === "true";

  const type =
    String(result.type || "").toUpperCase();

  const used =
    result.alreadyUsed === true ||
    result.used === true ||
    type === "USED" ||
    type === "ALREADY_USED" ||
    status === "ALREADY_USED" ||
    status === "USED";


  if (
    success ||
    valid ||
    type === "VALID" ||
    status === "VALID" ||
    status === "AVAILABLE" ||
    status === "SUCCESS"
  ) {

    showValid(
      result.ticketId ||
      result.ticket ||
      ticketId,
      result.message ||
      "Entry allowed."
    );

    return;

  }

  if (used) {

    showUsed(
      result.ticketId ||
      ticketId,
      result.message
    );

    return;

  }


  if (
    status === "INVALID" ||
    status === "NOT_FOUND" ||
    result.valid === false
  ) {

    showInvalid(
      result.ticketId ||
      ticketId,
      result.message
    );

    return;

  }


  showError(
    result.message ||
    result.error ||
    "Unexpected response from the ticket server."
  );

}

/* ============================================================
   SCAN NEXT
   ============================================================ */

async function scanNextTicket() {

  /*
   * This is the important part.
   *
   * We do NOT reload the page.
   *
   * We completely destroy the previous
   * Html5Qrcode instance and start a
   * brand-new camera session.
   */

  validationInProgress = false;

  scanInProgress = false;

  cameraStarting = false;


  await cleanupScanner();


  await sleep(500);


  await startScanner();

}


/* ============================================================
   CANCEL
   ============================================================ */

async function cancelScan() {

  validationInProgress = false;

  scanInProgress = false;

  cameraStarting = false;


  await cleanupScanner();


  showReady();

}


/* ============================================================
   CLEANUP CAMERA
   ============================================================ */

async function cleanupScanner() {

  scannerRunning = false;

  /*
   * Detach the instance immediately. This prevents a second
   * cleanup/start operation from acting on the same scanner.
   */
  const oldScanner = scanner;
  scanner = null;

  if (oldScanner) {

    try {

      if (oldScanner.isScanning) {
        await oldScanner.stop();
      }

    } catch (e) {

      console.warn(
        "Scanner stop:",
        e
      );

    }


    try {

      await oldScanner.clear();

    } catch (e) {

      console.warn(
        "Scanner clear:",
        e
      );

    }

  }


  stopAllVideoTracks();


  /*
   * Android Chrome sometimes needs
   * a little time to release camera.
   */

  await sleep(250);

}


/* ============================================================
   STOP ALL CAMERA TRACKS
   ============================================================ */

function stopAllVideoTracks() {

  try {

    const videos =
      document.querySelectorAll(
        "video"
      );


    videos.forEach(
      function(video) {

        if (
          video.srcObject
        ) {

          const stream =
            video.srcObject;


          stream
            .getTracks()
            .forEach(
              function(track) {

                track.stop();

              }
            );


          video.srcObject = null;

        }

      }
    );

  } catch (e) {

    console.warn(
      "Camera cleanup:",
      e
    );

  }

}


/* ============================================================
   UNREGISTER
   ============================================================ */

async function unregisterScanner() {

  const confirmed =
    window.confirm(
      "Unregister this phone as an event scanner?"
    );


  if (!confirmed) {

    return;

  }


  await cleanupScanner();


  localStorage.removeItem(
    STORAGE.registered
  );

  localStorage.removeItem(
    STORAGE.scannerId
  );

  localStorage.removeItem(
    STORAGE.scannerName
  );

  localStorage.removeItem(
    STORAGE.token
  );


  showRegistration();

}


/* ============================================================
   API REQUEST
   ============================================================ */

async function apiRequest(
  action,
  parameters = {}
) {

  if (
    !CONFIG.API_URL ||
    CONFIG.API_URL.includes("PASTE_YOUR")
  ) {

    throw new Error(
      "Apps Script API URL is not configured."
    );

  }


  const url =
    new URL(
      CONFIG.API_URL
    );


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(parameters)
    .forEach(
      function(key) {

        const value =
          parameters[key];


        if (
          value !== undefined &&
          value !== null
        ) {

          url.searchParams.set(
            key,
            value
          );

        }

      }
    );


  console.log(
    "API:",
    url.toString()
  );


  const response =
    await fetch(
      url.toString(),
      {

        method: "GET",

        cache: "no-store",

        redirect: "follow"

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "Server error: HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  console.log(
    "API response:",
    text
  );


  try {

    return JSON.parse(
      text
    );

  } catch (e) {

    throw new Error(
      "The server returned an invalid response."
    );

  }

}


/* ============================================================
   API WITH TIMEOUT
   ============================================================ */

async function apiRequestWithTimeout(
  action,
  parameters,
  timeout
) {

  let timer;

  try {

    return await Promise.race([

      apiRequest(
        action,
        parameters
      ),

      new Promise(
        function(
          resolve,
          reject
        ) {

          timer =
            setTimeout(
              function() {

                reject(
                  new Error(
                    "The ticket server did not respond. Check the internet connection."
                  )
                );

              },
              timeout
            );

        }
      )

    ]);

  } finally {

    clearTimeout(timer);

  }

}


/* ============================================================
   UNKNOWN ACTION DETECTOR
   ============================================================ */

function isUnknownAction(
  result
) {

  if (!result) {

    return false;

  }


  const text =
    String(
      result.message ||
      result.error ||
      ""
    ).toLowerCase();


  return (
    text.includes(
      "unknown api action"
    ) ||
    text.includes(
      "unknown action"
    )
  );

}


/* ============================================================
   MESSAGE
   ============================================================ */

function showMessage(
  element,
  text,
  error
) {

  element.textContent =
    text;


  element.className =
    "message " +
    (
      error
        ? "error"
        : "success"
    );

}


/* ============================================================
   FRIENDLY ERROR
   ============================================================ */

function friendlyError(
  error
) {

  if (!error) {

    return "Something went wrong.";

  }


  const text =
    String(
      error.message ||
      error
    );


  if (
    text.includes(
      "Failed to fetch"
    )
  ) {

    return (
      "Could not connect to the ticket server. " +
      "Please check the internet connection."
    );

  }


  return text;

}

/* ============================================================
   UTILITIES
   ============================================================ */

function sleep(
  milliseconds
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

   PAGE VISIBILITY
   ============================================================ */

    if (

   BACK/FORWARD CACHE
   ============================================================ */

window.addEventListener(
  "pageshow",
  function(event) {

    if (
      event.persisted
    ) {

      scanner = null;

      scannerRunning = false;

      cameraStarting = false;

      scanInProgress = false;

      validationInProgress = false;


      initialize();

    }

  }
);
