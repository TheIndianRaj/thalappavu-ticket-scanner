<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <meta name="theme-color" content="#087ff5">

  <title>Event Ticket Scanner</title>

  <!-- QR scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    /* =====================================================
       GLOBAL
       ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f4f7fb 0%,
          #eef2f6 100%
        );

      color: #17191c;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      min-height: 100vh;

      padding:
        22px
        16px
        40px;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }


    /* =====================================================
       CARD
       ===================================================== */

    .card {
      background: #ffffff;

      border-radius: 30px;

      padding:
        34px
        28px;

      box-shadow:
        0 10px 35px rgba(
          0,
          0,
          0,
          0.08
        );
    }


    /* =====================================================
       BRAND
       ===================================================== */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 28px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #087ff5,
          #0066d6
        );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      font-weight: 700;

      box-shadow:
        0 6px 16px
        rgba(
          8,
          127,
          245,
          0.25
        );
    }

    .brand-text {
      font-size: 16px;
      font-weight: 700;

      color: #687078;

      letter-spacing: 0.4px;
    }


    /* =====================================================
       HEADINGS
       ===================================================== */

    h1 {
      margin: 0 0 12px;

      font-size: 42px;
      line-height: 1.08;

      letter-spacing: -1.6px;
    }

    h2 {
      margin: 0;

      font-size: 28px;
      line-height: 1.2;
    }

    .subtitle {
      margin:
        0
        0
        34px;

      font-size: 19px;
      line-height: 1.55;

      color: #6c737b;
    }


    /* =====================================================
       FORM
       ===================================================== */

    .form-group {
      margin-bottom: 22px;
    }

    .label {
      display: block;

      margin-bottom: 9px;

      font-size: 17px;
      font-weight: 700;

      color: #24272b;
    }

    .input {
      width: 100%;

      min-height: 62px;

      padding:
        14px
        17px;

      border:
        1px solid
        #cdd2d8;

      border-radius: 17px;

      background: #fff;

      font-size: 19px;

      outline: none;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    .input:focus {
      border-color: #087ff5;

      box-shadow:
        0 0 0 4px
        rgba(
          8,
          127,
          245,
          0.12
        );
    }


    /* =====================================================
       PRIMARY BUTTON
       ===================================================== */

    .primary {
      width: 100%;

      min-height: 64px;

      padding:
        14px
        20px;

      border: none;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #087ff5,
          #066fe0
        );

      font-size: 20px;
      font-weight: 750;

      box-shadow:
        0 7px 18px
        rgba(
          8,
          127,

          0.23
        );

    .primary:active {

      opacity: .55;
      cursor: default;
    }


    /* =====================================================
       SECONDARY
       ===================================================== */

    .secondary {
      width: 100%;

      min-height: 58px;

      padding:
        13px
        18px;

      border: none;

      border-radius: 17px;

      background: #eeeeef;

      color: #292c30;

      font-size: 18px;
      font-weight: 650;

    /* =====================================================
       INFORMATION BOX
       ===================================================== */

      margin-top: 25px;

      border-radius: 18px;

    }

      color: #075da8;

      margin: 0;

       MESSAGE

      font-size: 21px;

    }

    .scanner-details {

        0

    }

       ===================================================== */

      margin-top: 23px;

      border-radius: 18px;

      font-weight: 750;

    }

    .camera-help p {

      line-height: 1.5;
    }

    details {
      margin-top: 12px;
    }

    summary {
      color: #0875d1;

      font-weight: 650;

      font-size: 16px;

      cursor: pointer;
    }

    .permission-list {
      margin:
        12px
        0
        0
        20px;

      padding: 0;

      color: #5d646c;

      font-size: 15px;

      line-height: 1.6;
    }


    /* =====================================================
       SCANNER
       ===================================================== */

    #qr-reader {
      width: 100%;

      overflow: hidden;

      border-radius: 22px;

      background: #101010;
    }

    #qr-reader video {
      width: 100% !important;

      height: auto !important;

      display: block;

      border-radius: 22px;
    }

    #qr-reader__dashboard {
      display: none !important;
    }

    #qr-reader__dashboard_section_csr {

    }

    #qr-reader__dashboard_section_swaplink {
      display: none !important;
    }

    .scanner-instruction {
      text-align: center;

      color: #697078;

      font-size: 17px;

      margin:
        18px
        0;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading-card {
      text-align: center;

      padding:
        70px
        25px;
    }

    .spinner {
      width: 62px;
      height: 62px;

      margin:
        0
        auto
        25px;

      border:
        7px solid
        #e3e6e9;

      border-top-color:
        #087ff5;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    /* =====================================================
       RESULT
       ===================================================== */

    .result {
      text-align: center;

      padding-top: 20px;

      border-top:
        9px solid;
    }

    .result.valid {
      border-color: #08a44f;
    }

    .result.invalid {
      border-color: #e21d2d;
    }

    .result.error {
      border-color: #ed9c00;
    }

    .result-icon {
      font-size: 62px;

      line-height: 1;

      margin-bottom: 12px;
    }

    .result.valid .result-icon {
      color: #08a44f;
    }

    .result.invalid .result-icon {
      color: #e21d2d;
    }

    .result.error .result-icon {
      color: #ed9c00;
    }

    .result-title {
      font-size: 33px;

      font-weight: 800;

      margin-bottom: 25px;
    }

    .result.valid .result-title {
      color: #087f3d;

    .result.invalid .result-title {
      color: #d7192e;
    }

    }

    .ticket-id {

      font-weight: 750;

    .entry {
      font-size: 26px;

      font-weight: 800;

      margin-bottom: 10px;
    }

    .result-message {
      color: #6b7177;

      font-size: 18px;

      line-height: 1.5;

        0
        28px;

       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .page {

          14px

          28px
          20px;

        border-radius: 25px;
      }

</head>


<body>

<div id="app"></div>


<script>

/* ============================================================
   CONFIGURATION
   ============================================================

   IMPORTANT:
   Put your STABLE Apps Script /exec URL here.

   Example:

   https://script.google.com/macros/s/XXXXXXXX/exec

   ============================================================ */

const CONFIG = {

  API_URL:
    "https://script.google.com/macros/s/AKfycbyTVy6vn2zxI8Aeqm5uLGmdf5wY34Js-I_Zpfa1XxgZaluVDXgExmHk6evCM798Ap-w/exec",

  VALIDATION_TIMEOUT:
    15000,

  CAMERA_DELAY:
    500

};


/* ============================================================
   STATE
   ============================================================ */

let scanner = null;

let scannerRunning = false;

let cameraStarting = false;

let scanInProgress = false;

let validationInProgress = false;


/* ============================================================
   STORAGE
   ============================================================ */

const STORAGE = {

  registered:
    "ticket_scanner_registered",

  scannerId:
    "ticket_scanner_id",

  scannerName:
    "ticket_scanner_name"

};


/* ============================================================
   START
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  initialize
);


function initialize() {

  if (
    !CONFIG.API_URL ||
    CONFIG.API_URL.includes("PASTE_YOUR")
  ) {

    showConfigError();

    return;

  }


  const registered =
    localStorage.getItem(
      STORAGE.registered
    );

  const scannerId =
    localStorage.getItem(
      STORAGE.scannerId
    );


  if (
    registered === "true" &&
    scannerId
  ) {

    showReady();

  } else {

    showRegistration();

  }

}


/* ============================================================
   REGISTRATION SCREEN
   ============================================================ */

function showRegistration() {

  cleanupScanner();

  document.getElementById("app").innerHTML = `

    <div class="page">

      <div class="container">

        <div class="card">

          <div class="brand">

            <div class="brand-icon">
              ✓
            </div>

            <div class="brand-text">
              EVENT TICKET SYSTEM
            </div>

          </div>


          <h1>
            Register Scanner
          </h1>


          <p class="subtitle">
            Register this phone once.
            It can then be used to validate
            tickets at the event entrance.
          </p>


          <div class="form-group">

            <label
              class="label"
              for="scannerName">

              Scanner name

            </label>

            <input
              id="scannerName"
              class="input"
              type="text"
              placeholder="Main Gate 1"
              autocomplete="off"
            >

          </div>


          <div class="form-group">

            <label
              class="label"
              for="registrationCode">

              Registration code

            </label>

            <input
              id="registrationCode"
              class="input"
              type="password"
              placeholder="Enter registration code"
              autocomplete="off"
            >

          </div>


          <button
            id="registerButton"
            class="primary"
            onclick="registerScanner()">

            REGISTER THIS PHONE

          </button>


          <div
            id="registrationMessage"
            class="message">
          </div>


          <div class="info-box">

            <div class="info-title">
              🔐 Authorized device
            </div>

            <p class="info-text">
              Only registered scanner phones
              can validate event tickets.
              Keep this device secure.
            </p>

          </div>

        </div>

      </div>

    </div>

  `;

}


/* ============================================================
   REGISTER
   ============================================================ */

async function registerScanner() {

  const name =
    document
      .getElementById("scannerName")
      .value
      .trim();

  const code =
    document
      .getElementById("registrationCode")
      .value
      .trim();


  const button =
    document.getElementById(
      "registerButton"
    );

  const message =
    document.getElementById(
      "registrationMessage"
    );


  if (!name) {

    showMessage(
      message,
      "Please enter a scanner name.",
      true
    );

    return;

  }


  if (!code) {

    showMessage(
      message,
      "Please enter the registration code.",
      true
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "REGISTERING...";

  showMessage(
    message,
    "Connecting to ticket server...",
    false
  );


  try {

    /*
     * IMPORTANT:
     *
     * We first try registerScanner.
     *
     * If the existing Apps Script uses
     * register instead, we automatically
     * try that too.
     */

    let result =
      await apiRequest(
        "registerScanner",
        {
          scannerName: name,
          registrationCode: code
        }
      );


    /*
     * Compatibility fallback.
     *
     * This handles older versions of
     * your Apps Script backend.
     */

    if (
      isUnknownAction(result)
    ) {

      console.log(
        "registerScanner not supported. Trying register..."
      );


      result =
        await apiRequest(
          "register",
          {
            scannerName: name,
            registrationCode: code
          }
        );

    }


    console.log(
      "Registration response:",
      result
    );


    if (
      !result
    ) {

      throw new Error(
        "No response received from the server."
      );

    }


    if (
      result.success === true ||
      result.status === "REGISTERED"
    ) {

      const scannerId =
        result.scannerId ||
        result.deviceId ||
        result.id;


      if (!scannerId) {

        throw new Error(
          "Registration succeeded but the server did not return a scanner ID."
        );

      }


      localStorage.setItem(
        STORAGE.registered,
        "true"
      );

      localStorage.setItem(
        STORAGE.scannerId,
        scannerId
      );

      localStorage.setItem(
        STORAGE.scannerName,
        name
      );


      showReady();

      return;

    }


    throw new Error(
      result.message ||
      result.error ||
      "Registration was rejected."
    );


  } catch (error) {

    console.error(
      "Registration error:",
      error
    );


    button.disabled = false;

    button.textContent =
      "REGISTER THIS PHONE";


    showMessage(
      message,
      friendlyError(
        error
      ),
      true
    );

  }

}


/* ============================================================
   READY SCREEN
   ============================================================ */

function showReady() {

  cleanupScanner();


  const name =
    localStorage.getItem(
      STORAGE.scannerName
    ) ||
    "Event Scanner";


  const id =
    localStorage.getItem(
      STORAGE.scannerId
    ) ||
    "";


  document.getElementById("app").innerHTML = `

    <div class="page">

      <div class="container">

        <div class="card">

          <div class="ready-status">

            <span class="ready-dot"></span>

            READY

          </div>


          <h1>
            Ticket Scanner
          </h1>


          <p class="scanner-details">

            ${escapeHtml(name)}

            ${id
              ? " • " +
                escapeHtml(id)
              : ""}

          </p>


          <button
            class="primary"
            onclick="startScanner()">

            📷 &nbsp; SCAN TICKET

          </button>


          <div class="camera-help">

            <div class="camera-help-title">
              📷 Camera permission
            </div>

            <p>
              Camera access is required
              to scan tickets.
            </p>


            <details>

              <summary>
                How to allow camera access
              </summary>


              <ol class="permission-list">

                <li>
                  Tap the site settings icon
                  beside the website address.
                </li>

                <li>
                  Select
                  <strong>Permissions</strong>.
                </li>

                <li>
                  Select
                  <strong>Camera</strong>.
                </li>

                <li>
                  Select
                  <strong>Allow</strong>.
                </li>

                <li>
                  Return here and tap
                  <strong>SCAN TICKET</strong>.
                </li>

              </ol>

            </details>

          </div>


          <div style="margin-top:20px;">

            <button
              class="secondary"
              onclick="unregisterScanner()">

              Unregister this scanner

            </button>

          </div>

        </div>

      </div>

    </div>

  `;

}


/* ============================================================
   START CAMERA
   ============================================================ */

async function startScanner() {

  if (
    cameraStarting ||
    scannerRunning
  ) {

    return;

  }


  cameraStarting = true;

  scanInProgress = true;


  /*
   * Always destroy previous scanner.
   */

  await cleanupScanner();


  renderScanner();


  await sleep(
    CONFIG.CAMERA_DELAY
  );


  try {

    scanner =
      new Html5Qrcode(
        "qr-reader"
      );


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * 0.70
              );

            return {

              width: size,

              height: size

            };

          },

        disableFlip: false

      },

      function(decodedText) {

        handleQr(
          decodedText
        );

      },

      function() {

        /*
         * Ignore normal
         * "QR not found"
         * messages.
         */

      }

    );


    scannerRunning = true;

    cameraStarting = false;


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    scannerRunning = false;

    cameraStarting = false;

    scanInProgress = false;


    await cleanupScanner();


    showCameraError(
      error
    );

  }

}


/* ============================================================
   QR FOUND
   ============================================================ */

async function handleQr(
  value
) {

  if (
    validationInProgress ||
    !scanInProgress
  ) {

    return;

  }


  validationInProgress = true;

  scanInProgress = false;


  const ticketId =
    String(
      value || ""
    ).trim();


  /*
   * Immediately stop camera.
   */

  await cleanupScanner();


  if (!ticketId) {

    validationInProgress = false;

    showError(
      "The QR code does not contain a ticket ID."
    );

    return;

  }


  validateTicket(
    ticketId
  );

}


/* ============================================================
   VALIDATE
   ============================================================ */

async function validateTicket(
  ticketId
) {

  showChecking();


  try {

    let result =
      await apiRequestWithTimeout(
        "validateTicket",
        {

          ticketId:
            ticketId,

          scannerId:
            localStorage.getItem(
              STORAGE.scannerId
            ),

          scannerName:
            localStorage.getItem(
              STORAGE.scannerName
            )

        },

        CONFIG.VALIDATION_TIMEOUT
      );


    /*
     * Compatibility fallback for
     * older backend action names.
     */

    if (
      isUnknownAction(result)
    ) {

      result =
        await apiRequestWithTimeout(
          "validate",
          {

            ticketId:
              ticketId,

            scannerId:
              localStorage.getItem(
                STORAGE.scannerId
              ),

            scannerName:
              localStorage.getItem(
                STORAGE.scannerName
              )

          },

          CONFIG.VALIDATION_TIMEOUT
        );

    }


    validationInProgress = false;


    processValidation(
      result,
      ticketId
    );


  } catch (error) {

    validationInProgress = false;


    showError(
      friendlyError(
        error
      )
    );

  }

}


/* ============================================================
   PROCESS VALIDATION
   ============================================================ */

function processValidation(
  result,
  ticketId
) {

  if (!result) {

    showError(
      "The server returned no response."
    );

    return;

  }


  console.log(
    "Validation result:",
    result
  );


  const status =
    String(
      result.status ||
      result.result ||
      ""
    ).toUpperCase();


  const valid =
    result.valid === true;


  const used =
    result.alreadyUsed === true ||
    result.used === true ||
    status === "ALREADY_USED" ||
    status === "USED";


  if (
    valid ||
    status === "VALID" ||
    status === "AVAILABLE" ||
    status === "SUCCESS"
  ) {

    showValid(
      result.ticketId ||
      ticketId,
      result.message
    );

    return;

  }


  if (used) {

    showUsed(
      result.ticketId ||
      ticketId,
      result.message
    );

    return;

  }


  if (
    status === "INVALID" ||
    status === "NOT_FOUND" ||
    result.valid === false
  ) {

    showInvalid(
      result.ticketId ||
      ticketId,
      result.message
    );

    return;

  }


  showError(
    result.message ||
    result.error ||
    "Unexpected response from the ticket server."
  );

}


/* ============================================================
   VALID
   ============================================================ */

function showValid(
  ticketId,
  message
) {

  document.getElementById("app").innerHTML = `

    <div class="page">

      <div class="container">

        <div class="card result valid">

          <div class="result-icon">
            ✓
          </div>

          <div class="result-title">
            VALID TICKET
          </div>

          <div class="ticket-id">
            ${escapeHtml(ticketId)}
          </div>

          <div class="entry">

/* ============================================================
   SCAN NEXT
   ============================================================ */

async function scanNextTicket() {

  /*
   * This is the important part.
   *
   * We do NOT reload the page.
   *
   * We completely destroy the previous
   * Html5Qrcode instance and start a
   * brand-new camera session.
   */

  validationInProgress = false;

  scanInProgress = false;

  cameraStarting = false;


  await cleanupScanner();


  await sleep(500);


  startScanner();

}


/* ============================================================
   CANCEL
   ============================================================ */

async function cancelScan() {

  validationInProgress = false;

  scanInProgress = false;

  cameraStarting = false;


  await cleanupScanner();


  showReady();

}


/* ============================================================
   CLEANUP CAMERA
   ============================================================ */

async function cleanupScanner() {

  scannerRunning = false;


  if (!scanner) {

    stopAllVideoTracks();

    return;

  }


  try {

    if (
      scanner.isScanning
    ) {

      await scanner.stop();

    }

  } catch (e) {

    console.warn(
      "Scanner stop:",
      e
    );

  }


  try {

    await scanner.clear();

  } catch (e) {

    console.warn(
      "Scanner clear:",
      e
    );

  }


  scanner = null;


  stopAllVideoTracks();


  /*
   * Android Chrome sometimes needs
   * a little time to release camera.
   */

  await sleep(250);

}


/* ============================================================
   STOP ALL CAMERA TRACKS
   ============================================================ */

function stopAllVideoTracks() {

  try {

    const videos =
      document.querySelectorAll(
        "video"
      );


    videos.forEach(
      function(video) {

        if (
          video.srcObject
        ) {

          const stream =
            video.srcObject;


          stream
            .getTracks()
            .forEach(
              function(track) {

                track.stop();

              }
            );


          video.srcObject = null;

        }

      }
    );

  } catch (e) {

    console.warn(
      "Camera cleanup:",
      e
    );

  }

}


/* ============================================================
   UNREGISTER
   ============================================================ */

async function unregisterScanner() {

  const confirmed =
    window.confirm(
      "Unregister this phone as an event scanner?"
    );


  if (!confirmed) {

    return;

  }


  await cleanupScanner();


  localStorage.removeItem(
    STORAGE.registered
  );

  localStorage.removeItem(
    STORAGE.scannerId
  );

  localStorage.removeItem(
    STORAGE.scannerName
  );


  showRegistration();

}


/* ============================================================
   API REQUEST
   ============================================================ */

async function apiRequest(
  action,
  parameters = {}
) {

  if (
    !CONFIG.API_URL ||
    CONFIG.API_URL.includes("PASTE_YOUR")
  ) {

    throw new Error(
      "Apps Script API URL is not configured."
    );

  }


  const url =
    new URL(
      CONFIG.API_URL
    );


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(parameters)
    .forEach(
      function(key) {

        const value =
          parameters[key];


        if (
          value !== undefined &&
          value !== null
        ) {

          url.searchParams.set(
            key,
            value
          );

        }

      }
    );


  console.log(
    "API:",
    url.toString()
  );


  const response =
    await fetch(
      url.toString(),
      {

        method: "GET",

        cache: "no-store",

        redirect: "follow"

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "Server error: HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  console.log(
    "API response:",
    text
  );


  try {

    return JSON.parse(
      text
    );

  } catch (e) {

    throw new Error(
      "The server returned an invalid response."
    );

  }

}


/* ============================================================
   API WITH TIMEOUT
   ============================================================ */

async function apiRequestWithTimeout(
  action,
  parameters,
  timeout
) {

  return Promise.race([

    apiRequest(
      action,
      parameters
    ),

    new Promise(
      function(
        resolve,
        reject
      ) {

        setTimeout(
          function() {

            reject(
              new Error(
                "The ticket server did not respond. Check the internet connection."
              )
            );

          },
          timeout
        );

      }
    )

  ]);

}


/* ============================================================
   UNKNOWN ACTION DETECTOR
   ============================================================ */

function isUnknownAction(
  result
) {

  if (!result) {

    return false;

  }


  const text =
    String(
      result.message ||
      result.error ||
      ""
    ).toLowerCase();


  return (
    text.includes(
      "unknown api action"
    ) ||
    text.includes(
      "unknown action"
    )
  );

}


/* ============================================================
   MESSAGE
   ============================================================ */

function showMessage(
  element,
  text,
  error
) {

  element.textContent =
    text;


  element.className =
    "message " +
    (
      error
        ? "error"
        : "success"
    );

}


/* ============================================================
   FRIENDLY ERROR
   ============================================================ */

function friendlyError(
  error
) {

  if (!error) {

    return "Something went wrong.";

  }


  const text =
    String(
      error.message ||
      error
    );


  if (
    text.includes(
      "Failed to fetch"
    )
  ) {

    return (
      "Could not connect to the ticket server. " +
      "Please check the internet connection."
    );

  }


  return text;

}

/* ============================================================
   UTILITIES
   ============================================================ */

function sleep(
  milliseconds
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

      scannerRunning = false;

      cameraStarting = false;

      scanInProgress = false;

      validationInProgress = false;


      initialize();

    }

);
